<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>男鞋商品聚类预测</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {width: 100vw; min-height: 100vh; background: #0f1941; color: #fff; font-family: "Microsoft Yahei", sans-serif; padding: 20px;}
    .container {max-width: 800px; margin: 0 auto; border: 1px solid #1fb2ff; border-radius: 8px; padding: 30px; background: rgba(31, 178, 255, 0.05);}
    .header {
      width: 100%;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      position: relative;
      margin-bottom: 30px;
      border-bottom: 1px solid #1fb2ff;
    }
    .back-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 8px 20px;
      background: linear-gradient(90deg, #1fb2ff, #36cfc9);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .form-item {margin-bottom: 20px; font-size: 18px;}
    label {display: inline-block; width: 150px; text-align: right; margin-right: 10px;}
    select, input, .slider {
      width: 300px;
      height: 40px;
      border: 1px solid #1fb2ff;
      border-radius: 4px;
      background: #0f1941;
      color: #fff;
      padding: 0 10px;
      font-size: 16px;
    }
    .predict-btn {
      display: block;
      width: 200px;
      height: 50px;
      margin: 30px auto;
      background: linear-gradient(90deg, #1fb2ff, #36cfc9);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .result-box {
      margin-top: 30px;
      padding: 20px;
      border: 1px dashed #1fb2ff;
      border-radius: 4px;
      text-align: center;
      font-size: 20px;
      line-height: 1.5;
    }
    #result {color: #36cfc9; font-weight: bold; font-size: 24px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      🧮 男鞋商品聚类预测
      <button class="back-btn" onclick="window.location.href='/'">返回数据分析大屏 →</button>
    </div>

    <div class="form-item">
      <label>商品品牌：</label>
      <select id="brand">
        <option value="李宁休闲">李宁休闲</option>
        <option value="阿迪达斯">阿迪达斯</option>
        <option value="耐克潮流">耐克潮流</option>
        <option value="鸿星尔克">鸿星尔克</option>
        <option value="安踏运动">安踏运动</option>
        <option value="其他品牌">其他品牌</option>
      </select>
    </div>

    <div class="form-item">
      <label>评论数：</label>
      <input type="number" id="comment_count" placeholder="请输入商品评论数" value="1000">
    </div>

    <div class="form-item">
      <label>用户平均年龄：</label>
      <input type="number" id="user_age" placeholder="请输入目标用户平均年龄" value="46">
    </div>

    <div class="form-item">
      <label>商品原价(元)：</label>
      <input type="number" id="original_price" placeholder="请输入商品原价" value="200">
    </div>

    <div class="form-item">
      <label>折扣率：</label>
      <input type="number" step="0.01" id="discount_rate" placeholder="请输入折扣率 0-1" value="0.8">
    </div>

    <div class="form-item">
      <label>当前售价(元)：</label>
      <input type="number" id="price" placeholder="请输入商品当前售价" value="160">
    </div>

    <div class="form-item">
      <label>好评率(%)：</label>
      <input type="number" step="0.1" id="good_rate" placeholder="请输入好评率 0-100" value="93">
    </div>

    <div class="form-item">
      <label>是否支持退货：</label>
      <select id="is_return">
        <option value="1">支持</option>
        <option value="0">不支持</option>
      </select>
    </div>

    <div class="form-item">
      <label>闭合方式：</label>
      <select id="close_style">
        <option value="系带">系带</option>
        <option value="套脚">套脚</option>
        <option value="魔术贴">魔术贴</option>
      </select>
    </div>

    <div class="form-item">
      <label>鞋底材质：</label>
      <select id="sole_material">
        <option value="橡胶">橡胶</option>
        <option value="EVA">EVA</option>
        <option value="PU">PU</option>
      </select>
    </div>

    <div class="form-item">
      <label>商品风格：</label>
      <select id="style">
        <option value="简约">简约</option>
        <option value="休闲">日常休闲</option>
        <option value="工装">工装硬朗</option>
        <option value="复古">复古潮鞋</option>
      </select>
    </div>

    <div class="form-item">
      <label>是否是会员：</label>
      <select id="is_plus">
        <option value="1">是</option>
        <option value="0">否</option>
      </select>
    </div>

    <button class="predict-btn" onclick="predict()">开始预测</button>

    <div class="result-box">
      🎯 预测结果：<br/>
      <span id="result">--</span>
    </div>
  </div>

<script>
function predict(){
  const reqData = {
    comment_count: document.getElementById('comment_count').value,
    user_age: document.getElementById('user_age').value,
    original_price: document.getElementById('original_price').value,
    discount_rate: document.getElementById('discount_rate').value,
    price: document.getElementById('price').value,
    good_rate: document.getElementById('good_rate').value,
    is_return: document.getElementById('is_return').value,
    close_style: document.getElementById('close_style').value,
    sole_material: document.getElementById('sole_material').value,
    style: document.getElementById('style').value,
    brand: document.getElementById('brand').value,
    is_plus: document.getElementById('is_plus').value
  };

  fetch('/api/cluster_predict', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(reqData)
  })
  .then(res => res.json())
  .then(result => {
    if(result.code === 200){
      document.getElementById('result').innerText = result.cluster_desc;
    }else{
      alert('预测失败：' + result.msg);
    }
  })
  .catch(e => {
    alert('请求错误：' + e.message);
  });
}
</script>
</body>
</html>
